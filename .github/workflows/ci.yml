name: CI — Adopty

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      # Valores falsos solo para que el build/SSR compile sin secretos reales.
      # Los previews de Vercel usan las env vars del proyecto.
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.e30.fake-key-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      # Tipos de TS/Astro: el lint no los cubre (ver eslint.config.mjs).
      - run: npm run check
      - run: npm test
      - run: npm run build

  # E2E contra un Supabase local de usar y tirar: migraciones + seed reales,
  # y el flujo completo (registro → publicar → solicitar → aprobar → chat).
  e2e:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local
        run: npx supabase start
      - name: Escribir .env con las claves locales
        run: |
          npx supabase status -o env > supabase.env
          . ./supabase.env
          {
            echo "PUBLIC_SUPABASE_URL=$API_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } > .env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:flujo
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
