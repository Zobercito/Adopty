name: Backup base de datos

# Copia de seguridad automática de Supabase (pg_dump).
# Corre cada noche a las 3:00 a. m. de Panamá (08:00 UTC) y también a mano
# desde la pestaña Actions → "Run workflow".
#
# Guarda el .sql.gz como artefacto (retención 90 días) y una copia off-site en
# Cloudflare R2 (retención 180 días). Para R2 hacen falta los secretos
# CLOUDFLARE_API_TOKEN (permiso Workers R2 Storage: Edit) y CLOUDFLARE_ACCOUNT_ID;
# sin ellos el backup local sigue funcionando y solo se omite la copia externa.

on:
  schedule:
    # 08:00 UTC = 03:00 Panamá (UTC-5, sin horario de verano)
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump + comprimir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secreto del repositorio: Supabase → Project Settings → Database → URI.
    # Usar el connection pooler: la IP dinámica de los runners no llega al host
    # directo. Formato:
    #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Versión del cliente = versión del servidor (Supabase corre PG 17).
      # Si un día Supabase actualiza, cambia este número también.
      PG_MAJOR: '17'
      # Copia off-site (Cloudflare R2). Ver comentario de cabecera.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: adopty-backups

    steps:
      - name: Instalar cliente pg_dump (misma versión que el servidor)
        run: |
          set -euo pipefail
          # La imagen de ubuntu-latest trae un pg_dump más viejo que el servidor
          # y éste aborta con "server version mismatch". Añadimos el repo de
          # PostgreSQL e instalamos la versión concreta.
          . /etc/os-release
          CODENAME="$VERSION_CODENAME"
          echo "Distro: $PRETTY_NAME ($CODENAME)"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # La línea necesita el componente "main" al final; sin él apt la rechaza.
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          cat /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR"
          sudo ln -sf "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" /usr/bin/pg_dump
          pg_dump --version

      - name: Verificar conexión
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL (Settings → Secrets → Actions)"
            exit 1
          fi
          psql "$DATABASE_URL" -tAc 'SELECT version()' | head -1

      - name: Generar dump
        run: |
          set -euo pipefail
          mkdir -p backups
          ARCHIVO="backups/adopty_$(date -u +%Y%m%d_%H%M%S).sql"
          # --clean --if-exists: dump completo, restaurable sobre una DB vacía
          pg_dump "$DATABASE_URL" --clean --if-exists --no-owner --no-privileges > "$ARCHIVO"
          gzip -9 "$ARCHIVO"
          ls -lh backups/

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: adopty-backup
          path: backups/*.sql.gz
          retention-days: 90
          if-no-files-found: error

      - name: Copia off-site en Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          WRANGLER="npx -y wrangler@4.154.0"
          # Idempotente: el bucket y la regla se crean solo la primera vez.
          if $WRANGLER r2 bucket list | grep -qF "$R2_BUCKET"; then
            echo "Bucket $R2_BUCKET ya existe"
          else
            $WRANGLER r2 bucket create "$R2_BUCKET"
          fi
          if ! $WRANGLER r2 bucket lifecycle list "$R2_BUCKET" | grep -qF 'expirar-180d'; then
            $WRANGLER r2 bucket lifecycle add "$R2_BUCKET" 'expirar-180d' \
              --expire-days 180 --abort-multipart-days 7 -y
          fi
          $WRANGLER r2 bucket lifecycle list "$R2_BUCKET" | grep -qF 'expirar-180d' \
            || { echo "::error::No se pudo aplicar la retención de 180 días en R2"; exit 1; }
          echo "Retención aplicada: regla expirar-180d"
          ARCHIVO=$(ls backups/*.sql.gz | head -1)
          CLAVE="db/$(basename "$ARCHIVO")"
          $WRANGLER r2 object put "$R2_BUCKET/$CLAVE" --file="$ARCHIVO" \
            --content-type application/gzip --remote
          {
            echo ""
            echo "### Copia off-site ✅"
            echo "- Bucket: \`$R2_BUCKET\`"
            echo "- Objeto: \`$CLAVE\`"
            echo "- SHA-256: \`$(sha256sum "$ARCHIVO" | cut -d' ' -f1)\`"
            echo "- Retención: 180 días"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumen
        run: |
          {
            echo "### Backup completado ✅"
            echo ""
            echo "Fecha: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            ls -lh backups/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Verificación de que el dump no esté vacío ni corrupto.
  verificar:
    name: Verificar integridad
    runs-on: ubuntu-latest
    needs: dump
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: adopty-backups
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: adopty-backup
      - name: El dump debe contener esquema y datos
        run: |
          set -euo pipefail
          ARCHIVO=$(ls *.sql.gz | head -1)
          gzip -t "$ARCHIVO"                       # el .gz no está corrupto
          gunzip -c "$ARCHIVO" > /tmp/dump.sql
          test "$(wc -c < /tmp/dump.sql)" -gt 10000 || { echo "::error::Dump sospechosamente vacío"; exit 1; }
          for tabla in usuarios mascotas solicitudes personas organizaciones; do
            grep -qi "CREATE TABLE.*$tabla" /tmp/dump.sql || { echo "::error::Falta la tabla $tabla"; exit 1; }
          done
          echo "Integridad OK: $(wc -l < /tmp/dump.sql) líneas"
          {
            echo ""
            echo "### Verificación ✅"
            echo "- \`gzip -t\` sin errores"
            echo "- $(wc -l < /tmp/dump.sql) líneas, $(du -h /tmp/dump.sql | cut -f1)"
            echo "- Tablas `usuarios`, `mascotas`, `solicitudes`, `personas` y `organizaciones` presentes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar copia descargándola desde R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          ARCHIVO=$(ls *.sql.gz | head -1)
          npx -y wrangler@4.154.0 r2 object get "$R2_BUCKET/db/$ARCHIVO" \
            --file=/tmp/r2.sql.gz --remote
          cmp "$ARCHIVO" /tmp/r2.sql.gz
          echo "Copia de R2 idéntica al artefacto ($(stat -c%s "$ARCHIVO") bytes)"
          echo "- Copia en R2 descargada y comparada con \`cmp\`: idéntica" >> "$GITHUB_STEP_SUMMARY"

  # Alerta visible sin depender de servicios externos: issue en el repo.
  alertar:
    name: Alertar si el backup falla
    runs-on: ubuntu-latest
    needs: [dump, verificar]
    if: always() && (needs.dump.result == 'failure' || needs.verificar.result == 'failure')
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const titulo = 'Backup de base de datos falló';
            const { owner, repo } = context.repo;
            const abiertos = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'backup',
            });
            if (abiertos.data.some((i) => i.title === titulo)) return;
            await github.rest.issues.create({
              owner,
              repo,
              title: titulo,
              labels: ['backup'],
              body: [
                'El workflow diario de backup falló.',
                '',
                `Ejecución: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                'Revisa el secreto `DATABASE_URL`, la cuota de Supabase y el estado del proyecto.',
                'Si falló la copia off-site, revisa `CLOUDFLARE_API_TOKEN` (permiso R2 Edit) y el bucket `adopty-backups`.',
              ].join('\n'),
            });
