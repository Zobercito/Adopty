version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Panama
    open-pull-requests-limit: 5
    # TypeScript 7 rompe el peer de @astrojs/check; se revisará cuando Astro
    # lo soporte. Los parches de la serie actual siguen entrando.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-y-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
